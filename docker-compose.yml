services:

  postgres:
    image: postgres:16
    container_name: cachai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachai
      POSTGRES_PASSWORD: cachai_local
      POSTGRES_DB: cachai
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachai -d cachai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cachai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - datos_redis:/data

volumes:
  datos_postgres:
  datos_redis: